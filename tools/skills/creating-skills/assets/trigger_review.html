<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trigger Eval Set Review</title>
<style>
  :root {
    --bg: #f6f5f0;
    --surface: #ffffff;
    --border: #dedbd1;
    --text: #1b1a17;
    --muted: #6f6b60;
    --accent: #b4492d;
    --accent-dark: #8f3722;
    --good: #4b6b2f;
    --bad: #a12f2f;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1.5rem; background: var(--bg); color: var(--text); font-family: var(--sans); }
  h1 { margin: 0 0 0.25rem; font-size: 1.35rem; }
  .subtitle { color: var(--muted); margin-bottom: 0.5rem; }
  .description { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; white-space: pre-wrap; }
  .description strong { display: block; margin-bottom: 0.25rem; }
  .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  button { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px; padding: 0.5rem 0.9rem; cursor: pointer; font-size: 0.85rem; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  button.danger { color: var(--bad); border-color: #e5c4c0; }
  .list { display: flex; flex-direction: column; gap: 0.6rem; max-width: 70rem; }
  .row { display: grid; grid-template-columns: 1fr auto auto; gap: 0.75rem; align-items: start; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem; }
  .row textarea { width: 100%; min-height: 4.5rem; resize: vertical; border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; font: inherit; font-size: 0.9rem; }
  .row textarea:focus { outline: 2px solid #e7c8bd; border-color: var(--accent); }
  .polarity { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; color: var(--muted); white-space: nowrap; padding-top: 0.4rem; }
  .polarity input { width: 1rem; height: 1rem; }
  .polarity.positive { color: var(--good); }
  .polarity.negative { color: var(--bad); }
  .summary { margin-top: 0.9rem; color: var(--muted); font-size: 0.85rem; }
  .status { margin-left: 0.5rem; color: var(--accent); font-size: 0.82rem; }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
  <h1>Trigger Eval Set Review</h1>
  <div class="subtitle">Edit the generated queries, adjust the expected trigger, then copy or download the JSON and return it to the agent. No server is needed.</div>
  <div class="description"><strong>Skill: <span id="skill-name"></span></strong><span id="skill-description"></span></div>
  <div class="controls">
    <button type="button" id="add-query">Add query</button>
    <button type="button" class="primary" id="download-queries">Download trigger_evals.json</button>
    <button type="button" id="copy-queries">Copy trigger_evals.json</button>
    <span class="status" id="status"></span>
  </div>
  <div class="list" id="query-list"></div>
  <p class="summary" id="summary"></p>
<script>
const TRIGGER_DATA = /*__EMBEDDED_DATA__*/;

const state = {
  queries: Array.isArray(TRIGGER_DATA.queries) ? TRIGGER_DATA.queries.map((item) => ({
    query: typeof item.query === "string" ? item.query : "",
    should_trigger: item.should_trigger === true,
  })) : [],
};

const list = document.getElementById("query-list");
const summary = document.getElementById("summary");
const statusNote = document.getElementById("status");
document.getElementById("skill-name").textContent = TRIGGER_DATA.skill_name || "";
document.getElementById("skill-description").textContent = TRIGGER_DATA.description || "";

function setStatus(message) {
  statusNote.textContent = message;
  if (message) {
    window.setTimeout(() => {
      if (statusNote.textContent === message) statusNote.textContent = "";
    }, 2500);
  }
}

function render() {
  list.replaceChildren();
  if (state.queries.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "No queries. Use Add query to create one.";
    list.appendChild(empty);
  }
  state.queries.forEach((item, index) => {
    const row = document.createElement("div");
    row.className = "row";

    const textarea = document.createElement("textarea");
    textarea.value = item.query;
    textarea.setAttribute("aria-label", "Query " + (index + 1));
    textarea.addEventListener("input", () => {
      state.queries[index].query = textarea.value;
      updateSummary();
    });

    const polarity = document.createElement("label");
    polarity.className = "polarity " + (item.should_trigger ? "positive" : "negative");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = item.should_trigger;
    checkbox.addEventListener("change", () => {
      state.queries[index].should_trigger = checkbox.checked;
      render();
    });
    const polarityText = document.createElement("span");
    polarityText.textContent = item.should_trigger ? "Should trigger" : "Should not trigger";
    polarity.append(checkbox, polarityText);

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "danger";
    remove.textContent = "Delete";
    remove.addEventListener("click", () => {
      state.queries.splice(index, 1);
      render();
    });

    row.append(textarea, polarity, remove);
    list.appendChild(row);
  });
  updateSummary();
}

function updateSummary() {
  const positive = state.queries.filter((item) => item.should_trigger).length;
  const negative = state.queries.length - positive;
  summary.textContent =
    state.queries.length + " queries: " + positive + " should trigger, " +
    negative + " should not trigger";
}

function normalizedQueries() {
  return state.queries
    .map((item) => ({
      query: item.query.trim(),
      should_trigger: item.should_trigger,
    }))
    .filter((item) => item.query !== "");
}

function queriesJson() {
  return JSON.stringify(normalizedQueries(), null, 2);
}

function downloadQueries() {
  const blob = new Blob([queriesJson()], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "trigger_evals.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  setStatus("Downloaded trigger_evals.json");
}

function copyQueries() {
  const text = queriesJson();
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(
      () => setStatus("Copied trigger_evals.json"),
      () => setStatus("Copy failed; download the JSON instead")
    );
    return;
  }
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.left = "-9999px";
  document.body.appendChild(area);
  area.select();
  try {
    document.execCommand("copy");
    setStatus("Copied trigger_evals.json");
  } catch (error) {
    setStatus("Copy failed; download the JSON instead");
  }
  area.remove();
}

document.getElementById("add-query").addEventListener("click", () => {
  state.queries.push({ query: "", should_trigger: true });
  render();
  const areas = list.querySelectorAll("textarea");
  if (areas.length) areas[areas.length - 1].focus();
});
document.getElementById("download-queries").addEventListener("click", downloadQueries);
document.getElementById("copy-queries").addEventListener("click", copyQueries);

render();
</script>
</body>
</html>
