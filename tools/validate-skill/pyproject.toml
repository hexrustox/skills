[project]
name = "validate-skill"
version = "0.1.0"
description = "Validate SKILL.md structure, references, and plugin registration"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
validate-skill = "validate_skill.cli:main"

[dependency-groups]
dev = ["mypy>=1.13", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validate_skill"]
